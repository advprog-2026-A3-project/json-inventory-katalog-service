name: CD to AWS EC2

on:
  workflow_run:
    workflows: ["Java CI with Gradle"]
    types: [completed]

jobs:
  deploy:
    name: Deploy Docker app to EC2
    if: >
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-22.04

    environment:
      name: production
      url: http://3.219.224.138

    steps:
      - name: Deploy via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e

            cd ~/json-inventory-katalog-service

            git fetch origin
            git checkout main
            git pull origin main

            sudo docker rm -f inventory-katalog || true
            sudo docker build -t inventory-katalog .
            sudo docker run -d \
              --name inventory-katalog \
              --restart unless-stopped \
              --env-file .env \
              -p 80:8080 \
              inventory-katalog

            sudo docker ps
          EOF

      - name: Publish deploy link
        run: |
          echo "### Deployment URL" >> $GITHUB_STEP_SUMMARY
          echo "http://3.219.224.138" >> $GITHUB_STEP_SUMMARY